name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: true
      - name: Require a merged, immutable version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse "$RELEASE_COMMIT^{commit}")"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'An existing release is never overwritten.' >&2
            exit 1
          fi
      - name: Verify source and modules
        run: |
          go mod download
          go mod verify
      - name: Build reproducible archives, SBOMs and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: go run ./cmd/release --version "$RELEASE_TAG" --out dist
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'
      - name: Sign and verify the exact checksums with GitHub OIDC
        env:
          SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          cosign verify-blob --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "$SIGNING_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt
          (cd dist && sha256sum --check checksums.txt)
      - name: Attest build provenance for the checksummed artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt
      - name: Retain signed release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-release
          path: dist/*
          if-no-files-found: error
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          printf 'Download your platform archive, checksums.txt and checksums.txt.sigstore.json.\n\n' > "$notes"
          printf 'Verify the workflow signature before checking your archive hash:\n\n```sh\n' >> "$notes"
          printf 'cosign verify-blob --bundle checksums.txt.sigstore.json --certificate-identity "%s" --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt\n' "$SIGNING_IDENTITY" >> "$notes"
          printf 'sha256sum --check --ignore-missing checksums.txt\n```\n\n' >> "$notes"
          printf 'Archives include onboarding, release verification, license and a binary-derived CycloneDX SBOM. See docs/releases.md for Windows verification and recovery guidance.\n' >> "$notes"
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --notes-file "$notes" --title "Bearforge $RELEASE_TAG"
