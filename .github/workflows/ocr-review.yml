name: OpenCodeReview PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

# Only owner-authorized requests share a PR's group. Outside PR events and
# ordinary comments must not cancel an active review. Check the triggering
# actor as well so another writer cannot rerun an owner's paid review.
concurrency:
  group: >-
    ${{
      github.triggering_actor == github.repository_owner
      && (
        (
          github.event_name == 'pull_request_target'
          && github.event.pull_request.user.login == github.repository_owner
          && !github.event.pull_request.draft
        )
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && github.event.comment.user.login == github.repository_owner
          && startsWith(github.event.comment.body, '/open-code-review')
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('ocr-noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  code-review:
    if: >-
      github.triggering_actor == github.repository_owner
      && (
        (
          github.event_name == 'pull_request_target'
          && github.event.pull_request.user.login == github.repository_owner
          && !github.event.pull_request.draft
        )
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && github.event.comment.user.login == github.repository_owner
          && startsWith(github.event.comment.body, '/open-code-review')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve pull request for manual review
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number
            });
            core.setOutput('state', pr.state);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('base_repository', pr.base.repo.full_name);
            core.setOutput('head_sha', pr.head.sha);

      - name: Create GitHub App token
        id: app-token
        if: github.event_name == 'pull_request_target' || steps.pr-context.outputs.state == 'open'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.OCR_APP_CLIENT_ID }}
          private-key: ${{ secrets.OCR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # GitHub requires repository write access to resolve review threads.
          permission-contents: write
          permission-pull-requests: write

      # The action checks out the trusted base and reads PR head blobs through
      # Git. Keep builds and tests that execute PR code in the separate CI job.
      - name: Review pull request
        id: ocr
        if: github.event_name == 'pull_request_target' || steps.pr-context.outputs.state == 'open'
        uses: alibaba/open-code-review@178543d92fecb7fcfe2da55ffcdc4486997fa75b # main, 2026-11-17
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          ocr_version: '1.13.11'
          llm_url: ${{ vars.OCR_LLM_URL || 'https://api.openai.com/v1/responses' }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL || 'gpt-6.1-sol' }}
          llm_use_anthropic: 'false'
          llm_protocol: openai-responses
          # Responses uses reasoning.effort; llm_reasoning_effort would add
          # the Chat Completions field reasoning_effort instead.
          llm_extra_body: '{"reasoning":{"effort":"high"}}'
          effort: high
          # The pinned OCR action cannot reliably identify a custom App for
          # sticky summaries or inline deduplication. Fresh posts ensure the
          # App authors every new summary and finding.
          sticky_summary: 'false'
          incremental: 'false'
          resolve_outdated: 'true'
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}

      - name: Submit review verdict
        if: steps.ocr.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        env:
          OCR_EXPECTED_HEAD: ${{ steps.pr-context.outputs.head_sha || github.event.pull_request.head.sha }}
          OCR_EXPECTED_BASE_REF: ${{ steps.pr-context.outputs.base_ref || github.event.pull_request.base.ref }}
          OCR_EXPECTED_BASE_REPOSITORY: ${{ steps.pr-context.outputs.base_repository || github.event.pull_request.base.repo.full_name }}
          OCR_COMMENTS_TOTAL: ${{ steps.ocr.outputs.comments_total }}
          OCR_COMMENTS_FAILED: ${{ steps.ocr.outputs.comments_failed }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          # Bundle the tested module inline: OCR's PR-base checkout must not
          # supply executable verdict code to this privileged workflow.
          script: |
            // BEGIN GENERATED OCR VERDICT
            async function submitReviewVerdict({ github, context, core, fs, env }) {
              const result = JSON.parse(fs.readFileSync('/tmp/ocr-result.json', 'utf8'));
              const manifest = result?.manifest;
              if (env.OCR_EXIT_CODE !== '0'
                  || result?.status !== 'complete'
                  || manifest?.schema_version !== 'ocr.run-manifest/v1'
                  || manifest.operation !== 'review'
                  || manifest.terminal_state !== 'complete'
                  || (manifest.run_failure !== null && manifest.run_failure !== undefined)) {
                throw new Error('OCR did not produce a complete review; no verdict submitted.');
              }

              const head = manifest.input?.resolved_head;
              if (!/^[0-9a-f]{40}$/.test(head || '')
                  || head !== env.OCR_EXPECTED_HEAD) {
                throw new Error('OCR reviewed an unexpected commit; no verdict submitted.');
              }
              const baseRef = env.OCR_EXPECTED_BASE_REF;
              const baseRepository = env.OCR_EXPECTED_BASE_REPOSITORY;
              if (typeof baseRef !== 'string' || baseRef.length === 0
                  || typeof baseRepository !== 'string' || baseRepository.length === 0) {
                throw new Error('OCR base snapshot is missing; no verdict submitted.');
              }

              const coverage = manifest.coverage;
              const buckets = ['selected', 'completed', 'reused', 'failed', 'waived'];
              if (!buckets.every(key => Array.isArray(coverage?.[key]))
                  || coverage.failed.length || coverage.waived.length) {
                throw new Error('OCR coverage is missing or incomplete; no verdict submitted.');
              }
              const selected = coverage.selected.map(item => item.item_id);
              const reviewed = [...coverage.completed, ...coverage.reused].map(item => item.item_id);
              const selectedIds = new Set(selected);
              if (!selected.every(id => typeof id === 'string' && id.length > 0)
                  || selectedIds.size !== selected.length
                  || new Set(reviewed).size !== reviewed.length
                  || reviewed.length !== selected.length
                  || !reviewed.every(id => selectedIds.has(id))) {
                throw new Error('OCR did not review every selected item; no verdict submitted.');
              }

              if (result.comments !== null && !Array.isArray(result.comments)) {
                throw new Error('OCR findings are invalid; no verdict submitted.');
              }
              const count = (result.comments || []).length;
              if (result.summary?.comments !== count
                  || env.OCR_COMMENTS_TOTAL !== String(count)
                  || env.OCR_COMMENTS_FAILED !== '0') {
                throw new Error('OCR findings were not fully published; no verdict submitted.');
              }
              if (result.warnings !== null && result.warnings !== undefined && !Array.isArray(result.warnings)) {
                throw new Error('OCR warnings are invalid; no verdict submitted.');
              }
              if (selected.length === 0) {
                core.info('OCR selected no files; no verdict submitted.');
                return;
              }
              if (count === 0 && (result.warnings?.length || result.summary.budget_exceeded)) {
                core.warning('OCR reported warnings or exhausted its budget; approval withheld.');
                return;
              }

              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: context.issue.number
              });
              if (pr.state !== 'open' || pr.draft || pr.head.sha !== head
                  || pr.base?.ref !== baseRef || pr.base?.repo?.full_name !== baseRepository) {
                core.info('PR is closed, a draft, or its head or base changed; no verdict submitted.');
                return;
              }
              const event = count === 0 ? 'APPROVE' : 'REQUEST_CHANGES';
              await github.rest.pulls.createReview({
                ...context.repo,
                pull_number: context.issue.number,
                commit_id: head,
                event,
                body: count === 0
                  ? `OpenCodeReview reviewed all ${selected.length} selected items with no findings.`
                  : `OpenCodeReview reported ${count} finding(s). Please address the findings in the inline comments and review summary.`
              });
              core.info(`Submitted ${event} for ${head}.`);
            }

            await submitReviewVerdict({
              github, context, core, fs: require('fs'), env: process.env
            });
            // END GENERATED OCR VERDICT
