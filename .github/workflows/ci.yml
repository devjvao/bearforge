name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      macos-arm64:
        description: Use native ARM64 macOS validation for release verification
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ${{ inputs.macos-arm64 && 'macos-26' || 'macos-26-intel' }}
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check generated review verdict
        if: runner.os == 'Linux'
        run: node --disallow-code-generation-from-strings .github/scripts/sync-ocr-review-verdict.cjs --check
      - name: Test review verdict automation
        if: runner.os == 'Linux'
        run: node --disallow-code-generation-from-strings --test .github/tests/*.test.cjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Race tests on Linux
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
      - run: go build ./cmd/bearforge
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise 60 disposable repositories
        env:
          BEARFORGE_SCALE_TEST: '1'
        run: go test ./internal/app -run TestPhase2Scale60 -count=1 -timeout=12m
